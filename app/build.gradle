plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.saurab.appsniper'
    compileSdk 36

    defaultConfig {
        applicationId "com.saurab.appsniper"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
    implementation 'androidx.core:core-ktx:1.13.1'
}
